filebeat.inputs:
  - type: container
    enabled: true
    paths:
      - ${HOME}/jpa-server-logs/*.json
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          when:
            regexp:
              message: '^\s*\{'
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true
      - drop_fields:
          fields: ["agent", "ecs", "event", "host", "input", "log", "stream"]
          ignore_missing: true

setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "myapp-logs-%{+yyyy-MM-dd}"

logging.level: info
logging.to_files: false
