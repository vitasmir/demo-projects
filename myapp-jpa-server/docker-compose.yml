  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.13
    container_name: filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../filebeat/modules.d:/usr/share/filebeat/modules.d:ro
#      - logstash
    healthcheck:
      test: ["CMD-SHELL", "ls /usr/share/filebeat/filebeat.yml >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - projects-network

  rabbitmq:
    image: rabbitmq:4.1.8
    ports:
      - "61613:61613"
# STOMP port
      - "5672:5672"
# AMQP protocol port
      - "15672:15672"
# Management UI port
      - "15674:15674"
# web-stomp (WS) for browser clients
    environment:
      - RABBITMQ_DEFAULT_USER=${DATATABLES_RABBITMQ_USERNAME:?Run with docker-compose-vault.sh}
      - RABBITMQ_DEFAULT_PASS=${DATATABLES_RABBITMQ_PASSWORD:?Run with docker-compose-vault.sh}
      - RABBITMQ_MNESIA_BASE=/var/lib/rabbitmq
      - RABBITMQ_ENABLED_PLUGINS=rabbitmq_stomp,rabbitmq_management,rabbitmq_web_stomp
    volumes:
      - ./rabbitmq:/etc/rabbitmq
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - projects-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: always

  keycloak:
    image: keycloak/keycloak:26.5.7
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_HEALTH_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=${DATATABLES_KEYCLOAK_ADMIN_USERNAME:?Run with docker-compose-vault.sh}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${DATATABLES_KEYCLOAK_ADMIN_PASSWORD:?Run with docker-compose-vault.sh}
    ports:
      - "8180:8080"
    volumes:
      - ../../myapp-jpa-server/src/main/resources/keycloak:/opt/keycloak/data/import:ro
    networks:
      - projects-network
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep '200 OK' <&3"
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: always
 
  postgres:
    image: postgres:17.7
    environment:
      - POSTGRES_USER=${DATATABLES_DB_USERNAME:?Run with docker-compose-vault.sh}
      - POSTGRES_PASSWORD=${DATATABLES_DB_PASSWORD:?Run with docker-compose-vault.sh}
      - POSTGRES_DB=${DATATABLES_DB_NAME:?Run with docker-compose-vault.sh}
    ports:
      - "5432:5432"
    networks:
      - projects-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "exec gosu \"$$(stat -c %u /proc/1)\" pg_isready -q -h /var/run/postgresql"]
      interval: 60s
      timeout: 5s
      retries: 5
    
    restart: always

volumes:
  es_data:
    driver: local
  filebeat_data:
    driver: local
  vault_data:
    driver: local
  keycloak_data:
    driver: local
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local


networks:
  projects-network:
    external: true
