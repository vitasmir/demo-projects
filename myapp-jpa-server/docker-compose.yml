  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.13
    container_name: filebeat
    user: root
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../filebeat/modules.d:/usr/share/filebeat/modules.d:ro
#      - logstash
    healthcheck:
      test: ["CMD-SHELL", "ls /usr/share/filebeat/filebeat.yml >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - projects-network
volumes:
  es_data:
    driver: local
  filebeat_data:
    driver: local

networks:
  projects-network:
    external: true
